<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jade</title>
    
    <!-- Cấu hình chuẩn cho App độc lập trên iOS và Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jade">
    <meta name="theme-color" content="#fbf7f4">

    <!-- Cấu hình hiển thị khung ảnh preview khi gửi link -->
    <meta property="og:title" content="Jade">
    <meta property="og:image" content="https://cdn.phototourl.com/member/2026-11-08-fb950d8d-aa6f-449d-8fd8-3283762a915b.png">
    <meta property="og:type" content="website">

    <!-- Icon Tab Trình Duyệt & Apple Touch Icon -->
    <link rel="icon" href="https://cdn.phototourl.com/member/2026-11-08-fb950d8d-aa6f-449d-8fd8-3283762a915b.png" type="image/png">
    <link rel="apple-touch-icon" href="https://cdn.phototourl.com/member/2026-11-08-fb950d8d-aa6f-449d-8fd8-3283762a915b.png">
    
    <!-- Manifest PWA Offline App -->
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Jade%22%2C%22short_name%22%3A%22Jade%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23fbf7f4%22%2C%22theme_color%22%3A%22%23fbf7f4%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn.phototourl.com%2Fmember%2F2026-11-08-fb950d8d-aa6f-449d-8fd8-3283762a915b.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-color: #fbf7f4; 
            --card-bg: #ffffff; 
            --primary-color: #d97757; 
            --accent-bg: #fff5ed;
            --text-color: #4a3e3d; 
            --text-muted: #8c7a78;
            --border-color: #f0e6e1; 
            --green-color: #679277;
            --red-color: #d96b6b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            font-family: 'Quicksand', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        
        .screen { 
            width: 100%; 
            max-width: 440px; 
            height: 100%; 
            max-height: 900px; 
            background: var(--bg-color); 
            display: flex; 
            flex-direction: column; 
            padding: 16px; 
            position: relative; 
        }
        
        @media (min-width: 480px) {
            .screen { 
                height: 95vh; 
                max-height: 920px; 
                border-radius: 28px; 
                box-shadow: 0 12px 32px rgba(180, 150, 140, 0.15); 
                border: 1px solid var(--border-color); 
            }
        }

        .phone-layout { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            flex: 1; 
            height: 100%; 
            overflow: hidden; 
        }
        
        .header-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 4px 0 8px 0;
            letter-spacing: 0.5px;
        }

        .panel { 
            background: var(--card-bg); 
            padding: 14px; 
            border-radius: 20px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 16px rgba(180, 140, 130, 0.05); 
        }
        
        .panel.history-panel { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            margin-bottom: 0; 
            min-height: 0; 
        }
        
        .form-group { 
            margin-bottom: 10px; 
            text-align: left; 
        }

        label { 
            display: block; 
            margin-bottom: 4px; 
            font-weight: 700; 
            font-size: 12px; 
            color: var(--text-muted); 
        }

        input[type="text"] { 
            width: 100%; 
            padding: 10px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            background: var(--bg-color); 
            color: var(--text-color); 
            font-size: 14px; 
            font-weight: 600;
            font-family: 'Quicksand', sans-serif; 
            transition: all 0.2s;
        }

        input:focus { 
            outline: none; 
            border-color: var(--primary-color); 
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.12); 
        }
        
        button { 
            width: 100%; 
            padding: 10px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 14px; 
            font-family: 'Quicksand', sans-serif; 
            transition: transform 0.1s ease, opacity 0.2s; 
        }

        button:active { transform: scale(0.98); }

        .btn-chinh { 
            background-color: var(--primary-color); 
            color: #ffffff; 
        }

        .btn-nap { 
            background-color: #e8f3ec; 
            color: var(--green-color); 
            font-weight: 800;
        }

        .quick-suggestions { 
            display: flex; 
            gap: 6px; 
            margin-top: 6px; 
            overflow-x: auto; 
            padding-bottom: 2px; 
        }

        .quick-suggestions::-webkit-scrollbar { display: none; }

        .suggestion-chip { 
            background: var(--accent-bg); 
            border: 1px solid var(--border-color); 
            padding: 5px 10px; 
            border-radius: 8px; 
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer; 
            white-space: nowrap; 
            color: var(--primary-color); 
        }

        .dashboard { 
            background: var(--accent-bg); 
            padding: 14px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            margin-top: 10px; 
            text-align: center;
        }

        .stat-box span { 
            font-size: 11px; 
            color: var(--text-muted); 
            font-weight: 700; 
            letter-spacing: 0.5px; 
        }

        .stat-box strong { 
            display: block; 
            font-size: 22px; 
            font-weight: 800; 
            margin-top: 4px; 
            color: var(--green-color);
        }

        .table-container { 
            flex: 1; 
            overflow-y: auto; 
            min-height: 0; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        
        td { 
            padding: 12px 6px; 
            border-bottom: 1px solid var(--border-color); 
            font-size: 13px; 
            vertical-align: middle; 
        }

        td:nth-child(1) { width: 45%; text-align: left; font-weight: 700; } 
        td:nth-child(2) { width: 33%; text-align: right; font-weight: 800; } 
        td:nth-child(3) { width: 15%; text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 600; } 
        td:nth-child(4) { width: 7%; text-align: right; }

        .delete-btn { 
            background: transparent; 
            color: var(--text-muted); 
            border: none; 
            width: 20px; 
            height: 20px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 14px; 
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover { color: var(--red-color); }
    </style>
</head>
<body>
    <div class="screen">
        <div class="phone-layout">
            <h1 class="header-title">Jade</h1>
            
            <div class="panel">
                <!-- Ô Nạp Tiền -->
                <div class="form-group">
                    <label>Nạp thêm tiền</label>
                    <div style="display: flex; gap: 8px;">
                        <div style="flex: 1; position: relative;">
                            <input type="text" id="depositAmount" placeholder="Số tiền nạp" oninput="handleMoneyInput('depositAmount', 'depositSuggestions')">
                            <div id="depositSuggestions" class="quick-suggestions"></div>
                        </div>
                        <button class="btn-nap" style="width: 80px;" onclick="depositMoney()">Nạp</button>
                    </div>
                </div>

                <div style="height: 1px; background: var(--border-color); margin: 10px 0;"></div>
                
                <!-- Ô Thêm Chi Tiêu -->
                <div class="form-group">
                    <label>Tên món đồ</label>
                    <input type="text" id="productName" placeholder="Ví dụ: Ăn sáng, Cà phê...">
                </div>
                
                <div class="form-group">
                    <label>Giá tiền</label>
                    <input type="text" id="productPrice" placeholder="Số tiền" oninput="handleMoneyInput('productPrice', 'priceSuggestions')">
                    <div id="priceSuggestions" class="quick-suggestions"></div>
                </div>
                
                <button class="btn-chinh" onclick="addExpense()" style="margin-top: 4px;">Thêm khoản chi</button>

                <!-- Thống kê Số Dư -->
                <div class="dashboard">
                    <div class="stat-box">
                        <span>SỐ DƯ HIỆN TẠI</span>
                        <strong id="currentBalance">0 đ</strong>
                    </div>
                </div>
            </div>

            <!-- Bảng Lịch Sử Giao Dịch -->
            <div class="panel history-panel">
                <div class="table-container">
                    <table>
                        <tbody id="expenseTableBody">
                            <tr><td colspan="4" style="text-align:center; color: var(--text-muted);">Chưa có khoản thu chi nào</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu ban đầu được đặt trống 100%
        const DEFAULT_DATA = {
            expenses: []
        };

        function getStorageData() {
            const data = localStorage.getItem('jade_standalone_clean_db');
            if (!data) {
                localStorage.setItem('jade_standalone_clean_db', JSON.stringify(DEFAULT_DATA));
                return DEFAULT_DATA;
            }
            return JSON.parse(data);
        }

        function saveStorageData(data) {
            localStorage.setItem('jade_standalone_clean_db', JSON.stringify(data));
        }

        let appData = getStorageData();

        function triggerVibration() {
            if ('vibrate' in navigator) navigator.vibrate(30);
        }

        window.handleMoneyInput = function(inputId, suggestionId) {
            const input = document.getElementById(inputId);
            const suggestionBox = document.getElementById(suggestionId);
            const rawVal = input.value.replace(/\D/g, '');
            if (!rawVal) {
                suggestionBox.innerHTML = '';
                return;
            }
            const num = parseInt(rawVal, 10);
            const suggestions = [num, num * 10, num * 100];
            suggestionBox.innerHTML = suggestions.map(val => {
                const formatted = val.toLocaleString('vi-VN') + ' đ';
                return `<div class="suggestion-chip" onclick="selectSuggestion('${inputId}','${suggestionId}', ${val})">${formatted}</div>`;
            }).join('');
        }

        window.selectSuggestion = function(inputId, suggestionId, value) {
            triggerVibration();
            document.getElementById(inputId).value = value.toLocaleString('vi-VN');
            document.getElementById(suggestionId).innerHTML = '';
        }

        function getCleanNumber(inputId) {
            const val = document.getElementById(inputId).value;
            return parseFloat(val.replace(/\./g, '').replace(' đ', '')) || 0;
        }

        function getShortDate() {
            const now = new Date();
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            return `${dd}/${mm}`;
        }

        function updateUI() {
            const expenses = appData.expenses || [];
            const totalDeposit = expenses.filter(e => e.type === 'deposit').reduce((a, b) => a + b.price, 0);
            const totalSpent = expenses.filter(e => e.type === 'expense').reduce((a, b) => a + b.price, 0);
            
            let currentBal = totalDeposit - totalSpent;
            document.getElementById('currentBalance').innerText = currentBal.toLocaleString('vi-VN') + ' đ';
            renderTable();
        }

        function renderTable() {
            const expenses = appData.expenses || [];
            const tbody = document.getElementById('expenseTableBody');
            
            if (expenses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 20px 0;">Chưa có khoản thu chi nào</td></tr>`;
                return;
            }

            tbody.innerHTML = expenses.slice().map((e, index) => {
                const realIndex = expenses.indexOf(e);
                const isDep = e.type === 'deposit';
                const sign = isDep ? '+' : '-';
                const color = isDep ? 'var(--green-color)' : 'var(--red-color)';
                
                return `<tr>
                    <td>${e.name}</td>
                    <td style="color:${color};">${sign}${e.price.toLocaleString('vi-VN')} đ</td>
                    <td>${e.time}</td>
                    <td><button class="delete-btn" onclick="deleteExpense(${realIndex})">✕</button></td>
                </tr>`;
            }).reverse().join('');
        }

        window.depositMoney = function() {
            triggerVibration();
            const amt = getCleanNumber('depositAmount');
            if(amt > 0) {
                appData.expenses.push({ 
                    name: 'Nạp tiền', 
                    price: amt, 
                    time: getShortDate(), 
                    type: 'deposit' 
                });
                saveStorageData(appData);
                document.getElementById('depositAmount').value = '';
                document.getElementById('depositSuggestions').innerHTML = '';
                updateUI();
            }
        };

        window.addExpense = function() {
            triggerVibration();
            const name = document.getElementById('productName').value.trim();
            const price = getCleanNumber('productPrice');
            if(name && price > 0) {
                appData.expenses.push({ 
                    name, 
                    price, 
                    time: getShortDate(), 
                    type: 'expense' 
                });
                saveStorageData(appData);
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('priceSuggestions').innerHTML = '';
                updateUI();
            }
        };

        window.deleteExpense = function(index) {
            triggerVibration();
            if(confirm("Bạn có chắc muốn xóa khoản này không?")) {
                appData.expenses.splice(index, 1);
                saveStorageData(appData);
                updateUI();
            }
        };

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        window.addEventListener('load', updateUI);
    </script>
</body>
</html>
